name: emergency-production-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fz-emergency-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_PROJECT_ID: prj_Y5AbwT02Hc5O74bAnmUzNlZSY2yq
      VERCEL_ORG_ID: team_xdfma3BySvP5iRuZ0WDK9S2k
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ALT: ${{ secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select Vercel authentication path
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN_PRIMARY" ]; then
            echo "VERCEL_TOKEN=$VERCEL_TOKEN_PRIMARY" >> "$GITHUB_ENV"
            echo "AUTH_MODE=token" >> "$GITHUB_ENV"
            echo "Using configured VERCEL_TOKEN"
          elif [ -n "$VERCEL_TOKEN_ALT" ]; then
            echo "VERCEL_TOKEN=$VERCEL_TOKEN_ALT" >> "$GITHUB_ENV"
            echo "AUTH_MODE=token" >> "$GITHUB_ENV"
            echo "Using configured VERCEL_ACCESS_TOKEN"
          else
            echo "AUTH_MODE=device" >> "$GITHUB_ENV"
            echo "No stored Vercel token; starting one-time OAuth device approval."
          fi
      - name: One-time Vercel device login
        if: env.AUTH_MODE == 'device'
        shell: bash
        run: |
          echo "Approve the Vercel device request shown below. This runner will continue automatically after approval."
          script -q -e -c "npx --yes vercel@59.11.7 login --no-color" /dev/null
      - name: Pin project identity
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Validate exact v0.6 source
        run: |
          node scripts/build.mjs
          node scripts/longitudinal-trends-v2.mjs
          node scripts/longitudinal-trends-v3.mjs
          node scripts/longitudinal-trends-v4.mjs
          node --check dist/assets/app.js
          node --check api/runtime-state.js
          node scripts/schema-smoke.mjs
          node scripts/smoke.mjs
      - name: Build Vercel output
        shell: bash
        run: |
          if [ "$AUTH_MODE" = "token" ]; then
            npx --yes vercel@59.11.7 build --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@59.11.7 build --prod
          fi
      - name: Deploy exact prebuilt output to production
        shell: bash
        run: |
          if [ "$AUTH_MODE" = "token" ]; then
            npx --yes vercel@59.11.7 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@59.11.7 deploy --prebuilt --prod
          fi
      - name: Verify public root and runtime state
        shell: bash
        run: |
          code=""
          for i in {1..30}; do
            code=$(curl -sS -o /tmp/fz-root -w '%{http_code}' https://fz-performance-mvp.vercel.app/ || true)
            if [ "$code" = "200" ] && grep -q 'FZ Performance' /tmp/fz-root; then break; fi
            sleep 5
          done
          test "$code" = "200"
          grep -q 'FZ Performance' /tmp/fz-root
          api_code=$(curl -sS -o /tmp/fz-state -w '%{http_code}' https://fz-performance-mvp.vercel.app/api/runtime-state || true)
          test "$api_code" = "200"
          grep -q '"masterValidated":true' /tmp/fz-state
          echo "PUBLIC ROOT PASS"
          echo "RUNTIME STATE PASS"
