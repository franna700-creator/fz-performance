name: production-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fz-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_PROJECT_ID: prj_Y5AbwT02Hc5O74bAnmUzNlZSY2yq
      VERCEL_ORG_ID: team_xdfma3BySvP5iRuZ0WDK9S2k
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Acquire GitHub OIDC identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.exportVariable('GITHUB_OIDC_TOKEN', token);

      - name: Exchange OIDC identity for short-lived Vercel access
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -f -X POST https://api.vercel.com/login/oauth/token \
            --data "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data "client_id=cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD" \
            --data "subject_token_type=urn:ietf:params:oauth:token-type:id_token" \
            --data "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            --data-urlencode "team_id_or_slug=$VERCEL_ORG_ID" \
            --data-urlencode "subject_token=$GITHUB_OIDC_TOKEN")
          token=$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.access_token||'')})")
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify Vercel authentication
        run: npx --yes vercel@59.11.7 whoami --token="$VERCEL_TOKEN"

      - name: Pin Vercel project identity
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Validate exact source
        run: |
          node scripts/build.mjs
          node scripts/longitudinal-trends-v2.mjs
          node scripts/longitudinal-trends-v3.mjs
          node scripts/longitudinal-trends-v4.mjs
          node --check dist/assets/app.js
          node --check api/runtime-state.js
          node scripts/schema-smoke.mjs
          node scripts/smoke.mjs

      - name: Build exact Vercel output
        run: npx --yes vercel@59.11.7 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exact prebuilt output to production
        run: npx --yes vercel@59.11.7 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify public production alias
        shell: bash
        run: |
          set -euo pipefail
          code=""
          for i in {1..30}; do
            code=$(curl -sS -o /tmp/fz-root -w '%{http_code}' https://fz-performance-mvp.vercel.app/ || true)
            if [ "$code" = "200" ] && grep -q 'FZ Performance' /tmp/fz-root; then
              break
            fi
            sleep 5
          done
          test "$code" = "200"
          grep -q 'FZ Performance' /tmp/fz-root

          api_code=$(curl -sS -o /tmp/fz-state -w '%{http_code}' https://fz-performance-mvp.vercel.app/api/runtime-state || true)
          test "$api_code" = "200"
          grep -q '"masterValidated":true' /tmp/fz-state

          echo "PUBLIC ROOT PASS"
          echo "RUNTIME STATE PASS"
