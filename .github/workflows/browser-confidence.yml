name: browser-confidence
on: [push]
jobs:
  webkit-refresh-regression:
    if: github.ref_name == 'fix/mobile-canonical-refresh-stall-2026-09-10'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright WebKit
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Reproduce baseline and verify fix in WebKit
        env:
          FZ_BASELINE_SHA: 51da79dfc680d9bac9f9e82589f1e37446ef7a2d
        run: node scripts/mobile-refresh-browser-confidence.mjs
