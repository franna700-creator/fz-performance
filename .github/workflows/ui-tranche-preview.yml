name: ui-tranche-preview

on:
  pull_request:
    paths:
      - 'src/today-redesign-v2.js'
      - 'src/today-redesign-v2.css'
      - 'src/trends-train-redesign-v1.js'
      - 'src/trends-train-redesign-v1.css'
      - 'src/training-exposure-v1.js'
      - 'src/training-exposure-v1.css'
      - 'src/goals-progress-v1.js'
      - 'src/goals-progress-v1.css'
      - 'src/system-intelligence.js'
      - 'src/system-rationalization-v1.css'
      - 'src/fz-design-system.css'
      - 'src/fz-topside-shell.css'
      - 'src/fz-hero-responsive.css'
      - 'src/fz-hero-desktop.webp'
      - 'src/fz-hero-mobile.webp'
      - 'lib/trends-dynamic.js'
      - 'api/system/status.js'
      - 'vercel.json'
      - 'docs/PHASE5_TRAINING_EXPOSURE_CONTRACT.md'
      - 'scripts/today-redesign-v2-browser-preview.mjs'
      - 'scripts/today-redesign-v2-smoke.mjs'
      - 'scripts/trends-train-redesign-v1-smoke.mjs'
      - 'scripts/trends-train-redesign-v1-browser-preview.mjs'
      - 'scripts/trends-train-phase2-acceptance.mjs'
      - 'scripts/training-exposure-v1-smoke.mjs'
      - 'scripts/training-exposure-v1-browser-preview.mjs'
      - 'scripts/goals-progress-v1-smoke.mjs'
      - 'scripts/goals-progress-v1-browser-preview.mjs'
      - 'scripts/system-rationalization-v1-browser-preview.mjs'
      - 'scripts/system-intelligence-smoke.mjs'
      - 'scripts/design-system-smoke.mjs'
      - 'src/shell/**'
      - 'src/app.css'
      - 'scripts/build.mjs'
      - 'scripts/build-source-smoke.mjs'
      - 'package.json'
      - '.github/workflows/ui-tranche-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture rebuilt desktop and mobile TODAY
        run: node scripts/today-redesign-v2-browser-preview.mjs
      - name: Capture rebuilt desktop and mobile TRENDS + TRAIN
        run: node scripts/trends-train-redesign-v1-browser-preview.mjs
      - name: Validate Phase 2 cross-surface and exact prescription
        run: node scripts/trends-train-phase2-acceptance.mjs
      - name: Capture Phase 5 Training Exposure interactions
        run: node scripts/training-exposure-v1-browser-preview.mjs
      - name: Capture rebuilt desktop and mobile GOALS
        run: node scripts/goals-progress-v1-browser-preview.mjs
      - name: Capture rebuilt desktop and mobile SYSTEM
        run: node scripts/system-rationalization-v1-browser-preview.mjs
      - name: Upload rebuilt UI preview
        uses: actions/upload-artifact@v4
        with:
          name: fz-ui-overhaul-preview-${{ github.sha }}
          path: |
            artifacts/ui-tranche1-v2/
            artifacts/ui-tranche2-v1/
            artifacts/ui-phase5-training-exposure-v1/
            artifacts/ui-tranche3-goals-v1/
            artifacts/ui-tranche4-system-v1/
          if-no-files-found: error
          retention-days: 14