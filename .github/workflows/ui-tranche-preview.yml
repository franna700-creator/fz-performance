name: ui-tranche-preview

on:
  pull_request:
    paths:
      - 'src/today-experience.js'
      - 'src/today-experience.css'
      - 'src/fz-design-system.css'
      - 'scripts/today-experience-browser-preview.mjs'
      - 'scripts/clean-shell.mjs'
      - '.github/workflows/ui-tranche-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture desktop and mobile TODAY
        run: node scripts/today-experience-browser-preview.mjs
      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: fz-ui-tranche1-preview-${{ github.sha }}
          path: artifacts/ui-tranche1/
          if-no-files-found: error
          retention-days: 14
