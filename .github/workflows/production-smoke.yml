name: production-release-smoke

on:
  push:
    branches:
      - acceptance/garmin-ciq-staged-smoke
    paths:
      - 'scripts/production-smoke.mjs'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Immutable staged deployment URL or current production URL'
        required: true
        default: 'https://fz-performance-mvp.vercel.app'
        type: string

permissions:
  contents: read

concurrency:
  group: fz-production-release-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FZ_PROD_URL: ${{ inputs.target_url || 'https://fz-performance-qq3ls6xqx-franna700-2546.vercel.app' }}
      FZ_ARTIFACT_DIR: artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise the immutable release target
        run: node scripts/production-smoke.mjs
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fz-production-release-smoke-failure
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
