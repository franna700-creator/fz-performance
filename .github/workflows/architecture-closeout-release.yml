name: architecture-closeout-release

on:
  push:
    branches:
      - release-architecture-integrity-closeout

permissions:
  contents: read

concurrency:
  group: architecture-closeout-release
  cancel-in-progress: false

jobs:
  restore-verified-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_xdfma3BySvP5iRuZ0WDK9S2k
      VERCEL_PROJECT_ID: prj_Y5AbwT02Hc5O74bAnmUzNlZSY2yq
      ROLLBACK_DEPLOYMENT_ID: dpl_JCwZJuwaHkBUkJtjwTciTFAF1rRj
      ROLLBACK_DEPLOYMENT_URL: https://fz-performance-mv3t0bm88-franna700-2546.vercel.app

    steps:
      - name: Require Vercel deployment credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured. Rollback cannot proceed."
            exit 1
          fi

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.15.1

      - name: Verify rollback deployment remains READY
        run: vercel inspect "$ROLLBACK_DEPLOYMENT_URL" --token="$VERCEL_TOKEN"

      - name: Restore verified production without rebuild
        shell: bash
        run: |
          set -euo pipefail
          printf '{}' > /tmp/empty.json
          vercel --token="$VERCEL_TOKEN" api POST "/v10/projects/$VERCEL_PROJECT_ID/promote/$ROLLBACK_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" --input /tmp/empty.json
          echo "Restored production deployment: $ROLLBACK_DEPLOYMENT_ID"

      - name: Confirm production promotion state
        run: vercel --token="$VERCEL_TOKEN" promote status fz-performance-mvp
