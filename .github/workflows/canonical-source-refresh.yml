name: canonical-source-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4,18 * * *'

permissions:
  contents: read

concurrency:
  group: fz-canonical-source-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh upstream evidence and converge canonical intelligence
        shell: bash
        run: |
          node <<'NODE'
          const base='https://fz-performance-mvp.vercel.app';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

          function neonQuotaBlocked(text=''){
            return /HTTP status 402|exceeded the quota|neon:retryable/i.test(String(text));
          }

          async function requestJson(url,options={},label='request'){
            const response=await fetch(url,options);
            const text=await response.text();
            let body=null;
            try{body=JSON.parse(text)}catch{}
            if(!response.ok&&response.status!==202){
              if(neonQuotaBlocked(text)){
                console.warn('NEON_QUOTA_BLOCKED: scheduled source refresh skipped until database service resumes.');
                process.exit(0);
              }
              throw new Error(label+' failed: HTTP '+response.status+' '+text.slice(0,1000));
            }
            return body||{};
          }

          async function postRefresh(sources){
            return requestJson(base+'/api/intelligence/refresh',{
              method:'POST',
              headers:{accept:'application/json','content-type':'application/json'},
              body:JSON.stringify({sources})
            },'intelligence refresh');
          }

          async function readCurrent(){
            return requestJson(base+'/api/intelligence/current',{
              headers:{accept:'application/json'},
              cache:'no-store'
            },'intelligence current');
          }

          function stateOf(current){
            const outbox=current?.markers?.mutationOutbox||current?.mutationOutbox||{};
            return {
              pendingCount:Number(outbox.pendingCount??-1),
              pendingPropagation:current?.pendingPropagation===true,
              convergenceStatus:current?.markers?.canonicalRevision?.status||current?.convergence?.status||null,
              pending:current?.pending||null
            };
          }

          function clean(state){
            return state.pendingCount===0 &&
              state.pendingPropagation===false &&
              state.convergenceStatus==='CONVERGED';
          }

          const sourceRefresh=await postRefresh(true);
          console.log(JSON.stringify({
            phase:'source-refresh',
            training:sourceRefresh?.steps?.sourceSync?.training||null,
            wellness:sourceRefresh?.steps?.sourceSync?.wellness||null,
            warnings:sourceRefresh?.warnings||[]
          }));

          await sleep(1200);
          let current=await readCurrent();
          let state=stateOf(current);
          console.log(JSON.stringify({phase:'convergence',attempt:1,...state}));
          if(clean(state))process.exit(0);

          const repair=await postRefresh(false);
          await sleep(1200);
          current=await readCurrent();
          state=stateOf(current);
          console.log(JSON.stringify({phase:'convergence',attempt:2,refreshRevision:repair?.afterRevision||null,...state}));
          if(clean(state))process.exit(0);

          console.error('scheduled source refresh did not reach a clean canonical state within bounded repair');
          console.error(JSON.stringify(state));
          process.exit(1);
          NODE
