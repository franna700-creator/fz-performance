name: intelligence-convergence

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/intelligence-convergence.yml'

permissions:
  contents: read

concurrency:
  group: fz-intelligence-convergence
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Reconcile pending canonical mutations
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://fz-performance-mvp.vercel.app';
          const currentUrl = base + '/api/intelligence/current';
          const refreshUrl = base + '/api/intelligence/refresh';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          function neonQuotaBlocked(text = '') {
            return /HTTP status 402|exceeded the quota|neon:retryable/i.test(String(text));
          }

          async function requestJson(url, options = {}, label = 'request') {
            const response = await fetch(url, options);
            const text = await response.text();
            let body = null;
            try { body = JSON.parse(text); } catch {}
            if (!response.ok && response.status !== 202) {
              if (neonQuotaBlocked(text)) {
                console.warn('NEON_QUOTA_BLOCKED: convergence backstop skipped until database service resumes.');
                process.exit(0);
              }
              throw new Error(label + ' failed: HTTP ' + response.status + ' ' + text.slice(0, 1000));
            }
            return body || {};
          }

          function stateOf(current) {
            const outbox = current?.markers?.mutationOutbox || current?.mutationOutbox || {};
            return {
              pendingCount: Number(outbox.pendingCount ?? -1),
              pendingPropagation: current?.pendingPropagation === true,
              convergenceStatus: current?.markers?.canonicalRevision?.status || current?.convergence?.status || null,
              pending: current?.pending || null
            };
          }

          function clean(state) {
            return state.pendingCount === 0 &&
              state.pendingPropagation === false &&
              state.convergenceStatus === 'CONVERGED';
          }

          async function readCurrent() {
            return requestJson(currentUrl, { headers: { accept: 'application/json' }, cache: 'no-store' }, 'intelligence current');
          }

          async function refresh() {
            return requestJson(refreshUrl, {
              method: 'POST',
              headers: { accept: 'application/json', 'content-type': 'application/json' },
              body: JSON.stringify({ sources: false })
            }, 'intelligence refresh');
          }

          let current = await readCurrent();
          let state = stateOf(current);
          console.log(JSON.stringify({ phase: 'probe', ...state }));
          if (clean(state)) process.exit(0);

          for (let attempt = 1; attempt <= 2; attempt += 1) {
            const refreshed = await refresh();
            await sleep(1200);
            current = await readCurrent();
            state = stateOf(current);
            console.log(JSON.stringify({
              phase: 'repair',
              attempt,
              refreshRevision: refreshed?.afterRevision || null,
              ...state
            }));
            if (clean(state)) process.exit(0);
          }

          console.error('Canonical intelligence did not converge within bounded repair window');
          console.error(JSON.stringify(state));
          process.exit(1);
          NODE
