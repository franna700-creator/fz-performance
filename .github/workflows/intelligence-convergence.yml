name: intelligence-convergence

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/intelligence-convergence.yml'

permissions:
  contents: read

concurrency:
  group: fz-intelligence-convergence
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Reconcile pending canonical mutations
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://fz-performance-mvp.vercel.app';
          const refreshUrl = base + '/api/intelligence/refresh';
          const statusUrl = base + '/api/system/status';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          function neonQuotaBlocked(text = '') {
            return /HTTP status 402|exceeded the quota|neon:retryable/i.test(String(text));
          }

          async function refresh() {
            const response = await fetch(refreshUrl, {
              method: 'POST',
              headers: {
                'accept': 'application/json',
                'content-type': 'application/json'
              },
              body: JSON.stringify({ sources: false })
            });
            const text = await response.text();
            let body = null;
            try { body = JSON.parse(text); } catch {}
            if (!response.ok && response.status !== 202) {
              if (neonQuotaBlocked(text)) {
                console.warn('NEON_QUOTA_BLOCKED: convergence skipped until database service resumes.');
                process.exit(0);
              }
              throw new Error('intelligence refresh failed: HTTP ' + response.status + ' ' + text.slice(0, 1000));
            }
            return body || {};
          }

          async function status() {
            const response = await fetch(statusUrl, {
              headers: { accept: 'application/json' },
              cache: 'no-store'
            });
            if (!response.ok) throw new Error('system status failed: HTTP ' + response.status);
            return response.json();
          }

          let last = null;
          for (let attempt = 1; attempt <= 2; attempt += 1) {
            const refreshed = await refresh();
            await sleep(1200);
            const current = await status();
            const intelligence = current?.intelligence?.current || {};
            const integrity = current?.systemIntegrity || {};
            const outbox = intelligence?.markers?.mutationOutbox || integrity?.invariants?.mutationOutbox || {};
            const pendingCount = Number(outbox.pendingCount ?? -1);
            const convergenceStatus = intelligence?.markers?.canonicalRevision?.status || integrity?.invariants?.convergenceStatus || null;
            const pendingPropagation = intelligence.pendingPropagation === true;

            last = {
              attempt,
              refreshRevision: refreshed?.afterRevision || null,
              pendingCount,
              pendingPropagation,
              convergenceStatus,
              systemIntegrityOk: integrity.ok === true
            };
            console.log(JSON.stringify(last));

            if (
              pendingCount === 0 &&
              pendingPropagation === false &&
              convergenceStatus === 'CONVERGED' &&
              integrity.ok === true
            ) {
              process.exit(0);
            }
            await sleep(1200);
          }

          console.error('Canonical intelligence did not converge within bounded retry window');
          console.error(JSON.stringify(last));
          process.exit(1);
          NODE
