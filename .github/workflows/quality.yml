name: quality
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node --check dist/assets/app.js
      - run: node --check api/runtime-state.js
      - run: node --check api/runtime-state-write.js
      - run: node --check api/wellness/today.js
      - run: node --check api/training/today.js
      - run: node --check api/training/memory.js
      - run: node --check api/source/fitness-ai/connect.js
      - run: node --check api/source/fitness-ai/callback.js
      - run: node --check api/source/fitness-ai/status.js
      - run: node --check api/source/tredict/status.js
      - run: node --check lib/db.js
      - run: node --check lib/runtime-store.js
      - run: node --check lib/source-connection-store.js
      - run: node --check lib/fitness-ai-client.js
      - run: node --check lib/tredict-client.js
      - run: node --check lib/wellness-store.js
      - run: node --check lib/wellness-sync.js
      - run: node --check lib/training-store.js
      - run: node --check lib/training-sync.js
      - run: node --check scripts/tranche2-live-wellness.mjs
      - run: node --check scripts/tranche2-live-wellness-v2.mjs
      - run: node --check scripts/tranche2-mobile-hardening.mjs
      - run: node --check scripts/tranche2-mobile-safe-area.mjs
      - run: node --check scripts/tranche3-option-b-ui.mjs
      - run: node --check scripts/tranche3-option-b-focus.mjs
      - run: node --check scripts/tranche3-historical-feedback-ui.mjs
      - run: node --check scripts/tranche3-training-memory-lenses.mjs
      - run: node --check scripts/tranche3-athlete-memory-consolidation.mjs
      - run: node --check scripts/tranche3-training-smoke.mjs
      - run: node --check scripts/smoke.mjs
      - run: node --check scripts/production-smoke.mjs
      - run: node -e "Promise.all([import('@neondatabase/serverless'),import('@modelcontextprotocol/client')]).then(() => console.log('Runtime drivers OK'))"
      - run: node scripts/schema-smoke.mjs
      - run: node scripts/tranche3-training-smoke.mjs
      - run: node scripts/smoke.mjs
      - name: Package validated release bundle
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: fz-validated-release-${{ github.sha }}
          path: |
            dist/
            api/
            lib/
            db/migrations/
          if-no-files-found: error
          retention-days: 14
