name: mobile-shell-browser

on:
  pull_request:
    paths:
      - 'src/app-clean.js'
      - 'src/intelligence-refresh.js'
      - 'src/adaptive-choice.js'
      - 'src/adaptive-choice.css'
      - 'src/training-memory-rich.js'
      - 'src/ui-context-recovery.js'
      - 'src/layout-stability.js'
      - 'api/training/athlete-event.js'
      - 'lib/athlete-auth.js'
      - 'lib/session-prescription-resolver.js'
      - 'db/migrations/006_athlete_auth.sql'
      - 'scripts/mobile-shell-browser-smoke.mjs'
      - 'scripts/layout-stability-browser-smoke.mjs'
      - 'scripts/tranche4-6-athlete-mode-browser-smoke.mjs'
      - 'scripts/athlete-access-dialog-stability-smoke.mjs'
      - 'scripts/athlete-access-dialog-browser-smoke.mjs'
      - 'src/shell/**'
      - 'src/app.css'
      - 'scripts/build.mjs'
      - 'scripts/build-source-smoke.mjs'
      - 'package.json'
      - '.github/workflows/mobile-shell-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install pinned Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise the complete mobile shell in a real browser
        run: node scripts/mobile-shell-browser-smoke.mjs
      - name: Exercise secure Athlete Mode end to end
        run: node scripts/tranche4-6-athlete-mode-browser-smoke.mjs
      - name: Keep Athlete Access setup open across adaptive rerenders
        run: node scripts/athlete-access-dialog-browser-smoke.mjs
      - name: Exercise TODAY/TRENDS viewport stability
        run: node scripts/layout-stability-browser-smoke.mjs
