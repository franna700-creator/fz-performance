name: one-time stage2 production stage

on:
  push:
    branches:
      - ops/stage2-release-2026-10-02
    paths:
      - '.github/workflows/stage2-production-stage-2026-10-02.yml'

permissions:
  contents: read

concurrency:
  group: fz-stage2-production-stage-2026-10-02
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_xdfma3BySvP5iRuZ0WDK9S2k
      VERCEL_PROJECT_ID: prj_Y5AbwT02Hc5O74bAnmUzNlZSY2yq
      RELEASE_SHA: 09891d1f392976ae485ddcf56ab9f11d16dfdf54
    steps:
      - name: Require release credential
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret unavailable"; exit 2; }

      - name: Checkout frozen release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify frozen release gate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node - <<'NODE'
          const fs=require('fs');
          const gate=JSON.parse(fs.readFileSync('config/controlled-deployment.json','utf8'));
          if(gate.enabled!==true) throw new Error('release gate not armed');
          if(gate.release!=='TRANCHE_5_2_STAGE_2_INGESTION') throw new Error('wrong release');
          if(gate.validatedCandidateSha!=='bf137b594b0ddf997a846c43b1888f4ea4fa78a8') throw new Error('validated candidate mismatch');
          if(gate.validatedCandidateTree!=='33e31d278f71006c91a79a20484a72556f0f1dfb') throw new Error('validated tree mismatch');
          NODE

      - name: Link exact Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Create staged Production deployment without assigning domains
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL="$(npx --yes vercel@latest --prod --skip-domain --yes --token="$VERCEL_TOKEN" --scope=franna700-2546)"
          echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Staged deployment: $DEPLOY_URL"
          echo "Production traffic has not been moved."

      - name: Summary
        shell: bash
        run: |
          echo "### Stage 2 staged Production candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release SHA: `$RELEASE_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production domains intentionally not assigned." >> "$GITHUB_STEP_SUMMARY"
