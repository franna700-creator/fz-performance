name: one-time-intelligence-converge

on:
  push:
    branches:
      - release-source-packager

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Converge production intelligence without source refresh
        shell: bash
        run: |
          set -euo pipefail
          URL="https://fz-performance-mvp.vercel.app/api/intelligence/refresh"
          CURRENT="https://fz-performance-mvp.vercel.app/api/intelligence/current"
          for attempt in 1 2 3; do
            echo "Convergence attempt $attempt"
            code=$(curl -sS -o /tmp/refresh.json -w '%{http_code}' \
              -X POST "$URL" \
              -H 'content-type: application/json' \
              --data '{"sources":false}')
            cat /tmp/refresh.json
            echo
            if [ "$code" != "200" ] && [ "$code" != "202" ]; then
              echo "Unexpected refresh HTTP $code" >&2
              exit 1
            fi
            curl -sS "$CURRENT" -o /tmp/current.json
            node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/current.json','utf8'));
          console.log(JSON.stringify({pendingPropagation:x.pendingPropagation,pending:x.pending,shadow:x.markers?.shadowRecommendation,active:x.markers?.activeRecommendation,activeRecommendation:x.activeRecommendation},null,2));
          process.exit(x.pendingPropagation ? 2 : 0);
          NODE
            status=$?
            if [ "$status" = "0" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Intelligence did not converge after 3 attempts" >&2
          exit 1
